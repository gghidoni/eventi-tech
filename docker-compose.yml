services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app:latest
    container_name: eventi-tech
    volumes:
      - ./:/var/www/html
    ports:
      - "9000:9000"
      - "5173:5173"
    networks:
      - eventi-tech-net
    restart: unless-stopped
    command: ["php-fpm"]

    dns:
      - 8.8.8.8
      - 1.1.1.1

  nginx:
    image: nginx:latest
    container_name: eventi-tech-nginx
    volumes:
      - ./:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8083:80"
    depends_on:
      - app
    networks:
      - eventi-tech-net

  postgres:
    image: postgres:15
    container_name: eventi-tech-postgres
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - eventi-tech-postgres:/var/lib/postgresql/data
    networks:
      - eventi-tech-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventi-tech-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - eventi-tech-net
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: eventi-tech-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}  # chiave master
    ports:
      - "7700:7700"
    networks:
      - eventi-tech-net
    restart: unless-stopped

networks:
  eventi-tech-net:
    driver: bridge

volumes:
  eventi-tech-postgres:
    driver: local