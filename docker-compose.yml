services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventi-tech-app:php8.4.20-node24.16
    container_name: eventi-tech
    volumes:
      - ./:/var/www/html
      - eventi-tech-vendor:/var/www/html/vendor
      - eventi-tech-node-modules:/var/www/html/node_modules
    ports:
      - "9000:9000"
      - "5173:5173"
    networks:
      - eventi-tech-net
    restart: unless-stopped
    command: ["php-fpm"]
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
      mailpit:
        condition: service_started

  nginx:
    image: nginx:1.30.2-trixie
    container_name: eventi-tech-nginx
    volumes:
      - ./:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8083:80"
    depends_on:
      - app
    networks:
      - eventi-tech-net

  postgres:
    image: postgres:17.10-bookworm
    container_name: eventi-tech-postgres
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - eventi-tech-postgres:/var/lib/postgresql/data
    networks:
      - eventi-tech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: eventi-tech-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - eventi-tech-net
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.44.0
    container_name: eventi-tech-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
    ports:
      - "7700:7700"
    volumes:
      - eventi-tech-meili-data:/meili_data
    networks:
      - eventi-tech-net
    restart: unless-stopped

networks:
  eventi-tech-net:
    driver: bridge

volumes:
  eventi-tech-postgres:
    driver: local
  eventi-tech-meili-data:
    driver: local
  eventi-tech-vendor:
    driver: local
  eventi-tech-node-modules:
    driver: local
