services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eventi-tech-app:php8.4.20-node24.16
    container_name: '${APP_CONTAINER_NAME:-eventi-tech}'
    volumes:
      - ./:/var/www/html
      - eventi-tech-vendor:/var/www/html/vendor
      - eventi-tech-node-modules:/var/www/html/node_modules
    ports:
      - '${FORWARD_APP_FPM_PORT:-9000}:9000'
      - '${FORWARD_VITE_PORT:-5173}:5173'
    networks:
      - eventi-tech-net
    restart: unless-stopped
    command: ["php-fpm"]
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  nginx:
    image: nginx:1.30.2-trixie
    container_name: '${NGINX_CONTAINER_NAME:-eventi-tech-nginx}'
    volumes:
      - ./:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '${FORWARD_APP_PORT:-8083}:80'
    depends_on:
      - app
    networks:
      - eventi-tech-net

  postgres:
    image: postgres:18.4-bookworm
    container_name: '${POSTGRES_CONTAINER_NAME:-eventi-tech-postgres}'
    environment:
      POSTGRES_DB: '${DB_DATABASE:?Set DB_DATABASE in .env}'
      POSTGRES_USER: '${DB_USERNAME:?Set DB_USERNAME in .env}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    volumes:
      - eventi-tech-postgres:/var/lib/postgresql
    networks:
      - eventi-tech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?Set DB_USERNAME in .env} -d ${DB_DATABASE:?Set DB_DATABASE in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: '${MAILPIT_CONTAINER_NAME:-eventi-tech-mailpit}'
    ports:
      - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - eventi-tech-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.44.0
    container_name: '${MEILISEARCH_CONTAINER_NAME:-eventi-tech-meilisearch}'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: '${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}'
    ports:
      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - eventi-tech-meili-data:/meili_data
    networks:
      - eventi-tech-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  eventi-tech-net:
    driver: bridge

volumes:
  eventi-tech-postgres:
    driver: local
  eventi-tech-meili-data:
    driver: local
  eventi-tech-vendor:
    driver: local
  eventi-tech-node-modules:
    driver: local
